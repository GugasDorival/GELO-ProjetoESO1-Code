spring.application.name=GELO
server.port=8081
server.servlet.session.timeout=30m

# Banco SQLite
# Os dados ficam no arquivo ./data/gelo.db e permanecem entre reinicializacoes.
# O caminho e relativo a pasta de onde o programa e executado; a pasta "data" e criada
# automaticamente na inicializacao (GeloApplication), pois o SQLite nao a cria sozinho.
# foreign_keys=on ativa as chaves estrangeiras, que o SQLite deixa desligadas por padrao.
spring.datasource.url=jdbc:sqlite:./data/gelo.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# O SQLite aceita uma escrita por vez; com mais de uma conexao ocorre "database is locked".
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Integracao JSF via JoinFaces
joinfaces.faces.project-stage=Development
joinfaces.faces.facelets-refresh-period=2
joinfaces.faces-servlet.enabled=true
joinfaces.faces-servlet.url-mappings=/faces/*,*.jsf,*.faces,*.xhtml

# Conta administrativa local inicial
gelo.bootstrap-admin.enabled=true
gelo.bootstrap-admin.nome=Administrador GELO
gelo.bootstrap-admin.email=admin@gelo.local
gelo.bootstrap-admin.senha=Admin123!


# Busca de livros (Google Books API)
# A chave e opcional: sem ela a API publica funciona, mas com cota compartilhada menor.
gelo.google-books.url=https://www.googleapis.com/books/v1/volumes
gelo.google-books.max-resultados=20
gelo.google-books.api-key=AIzaSyCbuR16UXNFnRMl2Me_oZ3yC7G4E5JAqzg
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s
