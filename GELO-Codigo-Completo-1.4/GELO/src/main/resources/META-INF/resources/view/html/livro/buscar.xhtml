<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<f:metadata>
    <f:viewParam name="termo" value="#{livroBean.termo}" />
    <f:viewParam name="tipo" value="#{livroBean.tipo}" />
    <f:event type="preRenderView" listener="#{entrarBean.exigirAutenticacao}" />
    <f:event type="preRenderView" listener="#{livroBean.carregarResultados}" />
</f:metadata>
<h:head>
    <title>Buscar livros | GELO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="#{facesContext.externalContext.requestContextPath}/view/css/gelo.css" />
</h:head>
<h:body>

<header><a class="brand" href="#{facesContext.externalContext.requestContextPath}/view/html/usuario/perfil.xhtml">GELO</a></header>
<main>
    <section class="card">
        <h1>Buscar livros</h1>
        <h:messages globalOnly="true" layout="list" styleClass="messages" infoClass="success-message" />
        <h:form id="buscaForm" styleClass="search-form">
            <div class="field search-term">
                <h:outputLabel for="termo" value="Título ou autor" />
                <h:inputText id="termo" value="#{livroBean.termo}" required="true"
                             requiredMessage="Digite o nome de um livro ou de um autor." maxlength="120" />
                <h:message for="termo" />
            </div>
            <div class="field search-type">
                <h:outputLabel for="tipo" value="Buscar por" />
                <h:selectOneMenu id="tipo" value="#{livroBean.tipo}">
                    <f:selectItems value="#{livroBean.tipos}" var="t" itemValue="#{t.name()}" itemLabel="#{t.rotulo}" />
                </h:selectOneMenu>
            </div>
            <div class="search-submit">
                <h:commandButton value="Pesquisar" action="#{livroBean.pesquisar}" />
            </div>
        </h:form>
    </section>

    <ui:fragment rendered="#{livroBean.pesquisaRealizada}">
        <section class="card">
            <h2>Resultados para “<h:outputText value="#{livroBean.termo}" />”</h2>

            <ui:fragment rendered="#{livroBean.semResultados}">
                <p class="muted">Nenhum livro encontrado. Tente outro título ou autor, ou use a busca geral.</p>
            </ui:fragment>

            <ul class="book-list">
                <ui:repeat value="#{livroBean.resultados}" var="livro">
                    <li class="book-item">
                        <ui:fragment rendered="#{livro.possuiCapa}">
                            <a href="livro.xhtml?faces-redirect=true">
                                <img class="book-cover" src="#{livro.urlCapa}" alt="Capa de #{livro.titulo}"
                                    loading="lazy" width="64" height="96" />
                            </a>
                        </ui:fragment>
                        <ui:fragment rendered="#{not livro.possuiCapa}">
                            <a href="livro.xhtml?faces-redirect=true">
                                <div class="book-cover book-cover-empty" aria-hidden="true">Sem capa</div>
                            </a>
                        </ui:fragment>
                        <div class="book-info">
                            <h3><h:outputText value="#{livro.titulo}" /></h3>
                            <p class="book-author"><h:outputText value="#{livro.autores}" /></p>
                            <p class="muted small">Publicado em: <h:outputText value="#{livro.anoPublicacao}" /></p>
                        </div>
                    </li>
                </ui:repeat>
            </ul>
        </section>
    </ui:fragment>

    <div class="links">
        <h:link outcome="/view/html/usuario/perfil" value="Voltar à página inicial" />
    </div>
</main>
<footer class="site-footer"><a class="footer-brand" href="#{facesContext.externalContext.requestContextPath}/" aria-label="GELO — página inicial">GELO</a><span class="site-footer-separator">·</span><span>Gerenciamento Eletrônico de Livros e Opiniões</span></footer>
</h:body>
</html>
