spring.application.name=GELO
server.port=8081
server.servlet.session.timeout=30m

# O banco H2 em arquivo permite iniciar o GELO sem instalar PostgreSQL.
# Os dados ficam na pasta ./data e permanecem entre reinicializa\u00c3\u00a7\u00c3\u00b5es.
spring.datasource.url=jdbc:h2:file:./data/gelodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Integra\u00c3\u00a7\u00c3\u00a3o JSF (Jakarta Faces) via JoinFaces.
joinfaces.faces.project-stage=Development
joinfaces.faces.facelets-refresh-period=2
joinfaces.faces-servlet.enabled=true
joinfaces.faces-servlet.url-mappings=/faces/*,*.jsf,*.faces,*.xhtml

# Conta administrativa local inicial. Altere essas propriedades antes de qualquer implanta\u00c3\u00a7\u00c3\u00a3o real.
gelo.bootstrap-admin.enabled=true
gelo.bootstrap-admin.nome=Administrador GELO
gelo.bootstrap-admin.email=admin@gelo.local
gelo.bootstrap-admin.senha=Admin123!

