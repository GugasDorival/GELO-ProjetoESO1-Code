spring.application.name=GELO
server.port=8081
server.servlet.session.timeout=30m

# Banco H2
# Os dados ficam na pasta ./data e permanecem entre reinicializacoes.
spring.datasource.url=jdbc:h2:file:./data/gelodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Integracao JSF via JoinFaces
joinfaces.faces.project-stage=Development
joinfaces.faces.facelets-refresh-period=2
joinfaces.faces-servlet.enabled=true
joinfaces.faces-servlet.url-mappings=/faces/*,*.jsf,*.faces,*.xhtml

# Conta administrativa local inicial
gelo.bootstrap-admin.enabled=true
gelo.bootstrap-admin.nome=Administrador GELO
gelo.bootstrap-admin.email=admin@gelo.local
gelo.bootstrap-admin.senha=Admin123!


# Busca de livros (Google Books API)
# A chave e opcional: sem ela a API publica funciona, mas com cota compartilhada menor.
gelo.google-books.url=https://www.googleapis.com/books/v1/volumes
gelo.google-books.max-resultados=20
gelo.google-books.api-key=AIzaSyCbuR16UXNFnRMl2Me_oZ3yC7G4E5JAqzg
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s
