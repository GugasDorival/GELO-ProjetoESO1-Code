spring.datasource.url=${GELO_DB_URL:jdbc:postgresql://localhost:5432/gelodb}
spring.datasource.username=${GELO_DB_USER:postgres}
spring.datasource.password=${GELO_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
