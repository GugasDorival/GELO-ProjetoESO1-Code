spring.application.name=GELO
server.port=8080
server.servlet.session.timeout=30m

# Banco H2 local em arquivo. Os dados permanecem entre inicializações.
spring.datasource.url=jdbc:h2:file:./data/gelodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSF via JoinFaces.
joinfaces.faces.project-stage=Development
joinfaces.faces.facelets-refresh-period=2
joinfaces.faces-servlet.url-mappings=*.xhtml

# Conta administrativa inicial apenas para desenvolvimento local.
gelo.bootstrap-admin.enabled=true
gelo.bootstrap-admin.nome=Administrador GELO
gelo.bootstrap-admin.email=admin@gelo.local
gelo.bootstrap-admin.senha=Admin123!
